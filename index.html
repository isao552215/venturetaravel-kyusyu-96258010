/* ===== ソート ===== */
function sortItinerary(){
    appState.itinerary.sort((a,b)=>{
        if(a.day!==b.day) return a.day-b.day;
        function mins(t){
            if(!t) return 9999;
            const m=t.match(/(\d{1,2})[:：](\d{2})/);
            if(m) return parseInt(m[1])*60+parseInt(m[2]);
            const h=t.match(/(\d{1,2})時/);
            if(h) return parseInt(h[1])*60;
            return 9999;
        }
        return mins(a.time)-mins(b.time);
    });
}

function showSync(on){ document.getElementById('sync-status').style.display=on?'flex':'none'; }

function showToast(msg, warn=false){
    const t=document.getElementById('toast');
    document.getElementById('toast-msg').textContent=msg;
    if(warn) t.classList.replace('bg-gray-800','bg-red-600');
    else     t.classList.replace('bg-red-600','bg-gray-800');
    t.classList.remove('opacity-0','-translate-y-4');
    setTimeout(()=>t.classList.add('opacity-0','-translate-y-4'),4000);
}

function showCustomConfirm(msg, onOk, onCancel=null, isAlert=false){
    document.getElementById('custom-confirm-msg').textContent=msg;
    const ok=document.getElementById('custom-confirm-ok');
    const ca=document.getElementById('custom-confirm-cancel');
    ca.style.display=isAlert?'none':'block';
    ok.onclick=()=>{ document.getElementById('custom-confirm-modal').classList.add('hidden'); if(onOk) onOk(); };
    ca.onclick=()=>{ document.getElementById('custom-confirm-modal').classList.add('hidden'); if(onCancel) onCancel(); };
    document.getElementById('custom-confirm-modal').classList.remove('hidden');
}

/* ===== GAS通信 ===== */
function buildGetUrl(){
    const u=new URL(GAS_WEB_APP_URL);
    u.searchParams.set('nocache',Date.now());
    return u.toString();
}
async function gasGet(url){
    const r=await fetch(url,{method:'GET',mode:'cors',cache:'no-store'});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
}
async function gasPost(payload){
    await fetch(GAS_WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});
    await new Promise(r=>setTimeout(r,800));
    return gasGet(buildGetUrl());
}
function showError(msg,e){
    console.error(msg,e);
    showCustomConfirm(msg+'\n\n'+(e?.message||''),null,null,true);
}

/* ===== クラウド ===== */
async function loadFromCloud(isManual=false){
    if(GAS_WEB_APP_URL.includes('ここにURL')){
        appState=JSON.parse(JSON.stringify(fallbackInitialData));
        sortItinerary();
        document.getElementById('initial-loading').style.display='none';
        document.getElementById('app-content').style.display='block';
        renderAll(); return;
    }
    if(isManual) showSync(true);
    try{
        const data=await gasGet(buildGetUrl());
        const isFirst=!data.appState||data.appState.isNew;
        if(isFirst){
            appState=JSON.parse(JSON.stringify(fallbackInitialData));
            sortItinerary(); cloudPhotos=[];
            document.getElementById('initial-loading').style.display='none';
            document.getElementById('app-content').style.display='block';
            clearUnsaved(); renderAll();
            await saveToCloud(true);
        } else {
            appState=data.appState; currentTimestamp=data.timestamp;
            if(!appState.statuses)     appState.statuses={};
            if(!appState.advanceCosts) appState.advanceCosts=[];
            if(!appState.paygCosts)    appState.paygCosts=[];
            if(!appState.itinerary)    appState.itinerary=[];
            if(!appState.travelDays)   appState.travelDays=1;
            cloudPhotos=data.photos||[];
            sortItinerary();
            document.getElementById('initial-loading').style.display='none';
            document.getElementById('app-content').style.display='block';
            clearUnsaved(); renderAll();
            if(isManual) showToast('最新データに更新しました');
        }
    } catch(e){
        // フォールバック
        console.warn('[GAS失敗] フォールバックで起動',e.message);
        appState=JSON.parse(JSON.stringify(fallbackInitialData));
        sortItinerary(); cloudPhotos=[];
        document.getElementById('initial-loading').style.display='none';
        document.getElementById('app-content').style.display='block';
        clearUnsaved(); renderAll();
        showToast('オフラインモードで表示中（クラウド未接続）',true);
    } finally {
        if(isManual) showSync(false);
    }
}

async function saveToCloud(force=false){
    if(GAS_WEB_APP_URL.includes('ここにURL')) return;
    showSync(true);
    try{
        if(!force){
            const latest=await gasGet(buildGetUrl());
            if(latest.timestamp&&latest.timestamp>currentTimestamp){
                showCustomConfirm('【警告】他の端末でデータが更新されています。\nこのまま上書き保存しますか？',
                    async()=>{ await saveToCloud(true); },
                    ()=>{ hasUnsavedChanges=false; loadFromCloud(false); }
                ); return;
            }
        }
        const data=await gasPost({action:'saveAll',payload:appState,lastTimestamp:currentTimestamp,force});
        if(data.timestamp&&data.timestamp>=currentTimestamp){
            currentTimestamp=data.timestamp;
            appState=data.appState||appState;
            cloudPhotos=data.photos||cloudPhotos;
            if(!appState.statuses)     appState.statuses={};
            if(!appState.advanceCosts) appState.advanceCosts=[];
            if(!appState.paygCosts)    appState.paygCosts=[];
            if(!appState.itinerary)    appState.itinerary=[];
            clearUnsaved(); renderAll();
            for(let d=1;d<=appState.travelDays;d++) refreshDayMap(d);
            showToast('スプレッドシートへ保存しました！');
        } else {
            showToast('⚠️ 保存できなかった可能性があります。',true);
        }
    } catch(e){ showError('保存に失敗しました。',e); }
    finally{ showSync(false); }
}

async function autoRefreshCheck(){
    if(hasUnsavedChanges||GAS_WEB_APP_URL.includes('ここにURL')) return;
    try{
        const data=await gasGet(buildGetUrl());
        if(data.timestamp&&data.timestamp>currentTimestamp){
            appState=data.appState; currentTimestamp=data.timestamp;
            cloudPhotos=data.photos||[];
            if(!appState.statuses)     appState.statuses={};
            if(!appState.advanceCosts) appState.advanceCosts=[];
            if(!appState.paygCosts)    appState.paygCosts=[];
            if(!appState.itinerary)    appState.itinerary=[];
            sortItinerary(); renderAll();
            showToast('他の端末からの更新を反映しました✨');
        }
    } catch(e){ console.warn('[自動更新失敗]',e.message); }
}

function toggleRainyMode(){
    const s=document.getElementById('schedule-section');

function renderCalendar(){
    const c=document.getElementById('calendar-grid');
    c.innerHTML='';
    ['日','月','火','水','木','金','土'].forEach(d=>c.innerHTML+=`<div class="text-gray-400 font-medium">${d}</div>`);
    const startOffset=12, travelStart=14;
    const total=Math.max(14,Math.ceil((appState.travelDays+(travelStart-startOffset))/7)*7);
    for(let i=0;i<total;i++){
        const cur=startOffset+i, dn=cur-travelStart+1;
        let dd=cur, ms='';
        if(dd>31){dd-=31;ms='8/';}
        if(dn>=1&&dn<=appState.travelDays){
            const s=getDayStyle(dn);
            c.innerHTML+=`<div class="${s.bg} text-white font-bold rounded shadow-sm py-1.5 relative h-12 flex flex-col items-center justify-center"><span class="text-sm">${ms}${dd}</span><span class="absolute bottom-1 text-[9px] scale-90 leading-none w-full text-center opacity-90">${dn}日目</span></div>`;
        } else {
            c.innerHTML+=`<div class="text-gray-400 py-1.5 h-12 flex items-center justify-center text-sm">${ms}${dd}</div>`;
        }
    }
}

/* ===== マップHTML生成ヘルパー ===== */
function buildMapHtml(d, dayItems){
    const style=getDayStyle(d);
    let routeNodes=dayItems.filter(i=>
        !i.title.includes('移動中')&&!i.title.includes('チェックイン')&&!i.title.includes('成田空港')&&
        appState.statuses[i.id]!=='1'&&appState.statuses[i.id]!=='2'
    );
    const targetItems=dayItems.filter(i=>
        !i.title.includes('移動中')&&!i.title.includes('チェックイン')&&!i.title.includes('成田空港')
    );
    const isDayComplete=targetItems.length>0&&targetItems.every(i=>
        appState.statuses[i.id]==='1'||appState.statuses[i.id]==='2'
    );

    if(isDayComplete){
        const ids=new Set([...dayItems.map(i=>i.id),...dayItems.map(i=>String(i.id))]);
        const photos=cloudPhotos.filter(p=>ids.has(p.itemId)||ids.has(String(p.itemId)));
        const sid=`slideshow-day${d}`;
        if(photos.length>0){
            const first=photos[Math.floor(Math.random()*photos.length)];
            return {html:`
                <div id="${sid}" class="w-full h-[576px] rounded-xl overflow-hidden relative border-2 border-yellow-300 shadow-lg">
                    <div id="${sid}-bg" class="absolute inset-0 bg-cover bg-center transition-opacity duration-1000" style="background-image:url('${first.thumbnailUrl}');"></div>
                    <div class="absolute inset-0 bg-black/45 backdrop-blur-[2px]"></div>
                    <div class="relative z-10 flex flex-col items-center justify-center h-full p-4">
                        <div class="text-4xl mb-2">🎉</div>
                        <p class="text-base font-black text-white">本日の日程コンプリート！</p>
                        <p class="text-xl font-black text-yellow-300 mt-1">おめでとうございます！</p>
                        <p class="text-sm text-white/80 mt-2">全 ${targetItems.length} スポット達成 ✨</p>
                        <p class="text-xs text-white/60 mt-1">${photos.length}枚の思い出</p>
                    </div>
                </div>`, isDayComplete:true, photos };
        } else {
            return {html:`
                <div class="w-full h-[576px] rounded-xl p-4 text-center border-2 border-yellow-300 bg-gradient-to-br from-yellow-50 via-amber-50 to-orange-50 shadow-md flex flex-col items-center justify-center">
                    <div class="text-5xl mb-3">🎉</div>
                    <p class="text-base font-black text-amber-700">本日の日程コンプリート！</p>
                    <p class="text-xl font-black text-orange-500 mt-1">おめでとうございます！</p>
                    <p class="text-sm text-amber-600 mt-2">全 ${targetItems.length} スポット達成 ✨</p>
                </div>`, isDayComplete:true, photos:[] };
        }
    }

    if(routeNodes.length>9) routeNodes=routeNodes.slice(0,9);
    if(routeNodes.length<1) return {html:'', isDayComplete:false, photos:[]};

    const origin=encodeURIComponent(routeNodes[0].title);
    const dest=encodeURIComponent(routeNodes[routeNodes.length-1].title);
    let wp='';
    if(routeNodes.length>2) wp='&waypoints='+routeNodes.slice(1,-1).map(i=>encodeURIComponent(i.title)).join('|');
    let fullUrl, embedUrl;
    if(routeNodes.length===1){
        fullUrl=`https://www.google.com/maps/search/?api=1&query=${origin}`;
        embedUrl=`https://maps.google.com/maps?q=${origin}&output=embed&z=13`;
    } else {
        fullUrl=`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}${wp}`;
        let da=dest;
        if(routeNodes.length>2){const wps=routeNodes.slice(1,-1).map(i=>encodeURIComponent(i.title)).join('+to:');da=wps+'+to:'+da;}
        embedUrl=`https://maps.google.com/maps?saddr=${origin}&daddr=${da}&output=embed&z=10`;
    }
    const excl=dayItems.filter(i=>appState.statuses[i.id]==='1'||appState.statuses[i.id]==='2').length;
    const badge=excl>0?`<span class="text-xs text-amber-600 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded font-bold"><i class="fa-solid fa-circle-minus"></i> 完了/スキップ ${excl}件除外中</span>`:'';

    return {html:`
        <div class="bg-gray-100 rounded-lg border border-gray-300 shadow-sm overflow-hidden">
            <div class="flex items-center flex-wrap gap-1 px-2 pt-2 pb-1 text-sm font-bold text-gray-700">
                <i class="fa-solid fa-map-location-dot text-blue-500"></i> 本日のルート ${badge}
            </div>
            <div class="w-full h-[576px] bg-white">
                <iframe width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="${embedUrl}"></iframe>
            </div>
            <div class="flex justify-between items-center px-2 py-2">
                <button onclick="loadFromCloud(true)" class="text-xs text-gray-600 font-bold bg-white px-3 py-1.5 rounded border border-gray-300 inline-flex items-center gap-1 shadow-sm"><i class="fa-solid fa-rotate-left"></i> 戻す</button>
                <a href="${fullUrl}" target="_blank" class="text-xs text-blue-600 font-bold bg-blue-50 px-3 py-1.5 rounded shadow-sm"><i class="fa-solid fa-arrow-up-right-from-square"></i> Google Mapsで開く</a>
            </div>
        </div>`, isDayComplete:false, photos:[] };
}

/* ===== マップ更新（ステータス変更時） ===== */
function refreshDayMap(d){
    const zone=document.getElementById(`map-zone-${d}`);
    if(!zone) return;
    const dayItems=appState.itinerary.filter(i=>i.day===d);
    const {html,isDayComplete,photos}=buildMapHtml(d,dayItems);
    zone.innerHTML=html;
    const sid=`slideshow-day${d}`;
    if(slideshowTimers.has(`day${d}`)){clearInterval(slideshowTimers.get(`day${d}`));slideshowTimers.delete(`day${d}`);}
    if(isDayComplete&&photos.length>1){
        const timer=setInterval(()=>{
            const bg=document.getElementById(`${sid}-bg`);
            if(!bg){clearInterval(timer);return;}
            const p=photos[Math.floor(Math.random()*photos.length)];
            bg.style.opacity='0';
            setTimeout(()=>{if(bg){bg.style.backgroundImage=`url('${p.thumbnailUrl}')`;bg.style.opacity='1';}},500);
        },3000);
        slideshowTimers.set(`day${d}`,timer);
    }
}

/* ===== ステータス ===== */
function updateStatusDecoration(id,val){
    const box=document.getElementById(`item-box-${id}`);
    const node=document.getElementById(`wbs-node-${id}`);
    if(!box||!node) return;
    box.classList.remove('bg-emerald-50','border-emerald-200','bg-amber-50','border-amber-200','opacity-70');
    node.classList.remove('bg-gray-200','text-gray-500','bg-emerald-500','text-white','border-emerald-600','bg-amber-500','border-amber-600');
    if(val==='1'){ box.classList.add('bg-emerald-50','border-emerald-200'); node.classList.add('bg-emerald-500','text-white','border-emerald-600'); }
    else if(val==='2'){ box.classList.add('bg-amber-50','border-amber-200','opacity-70'); node.classList.add('bg-amber-500','text-white','border-amber-600'); }
    else { node.classList.add('bg-gray-200','text-gray-500'); }
}
function updateWBSProgress(){
    const total=appState.itinerary.length;
    let done=0;
    appState.itinerary.forEach(i=>{ if(appState.statuses[i.id]==='1') done++; });
    const pct=total>0?Math.round(done/total*100):0;
    document.getElementById('wbs-progress-bar').style.width=`${pct}%`;
    document.getElementById('wbs-progress-text').textContent=`${done}/${total} 完了 (${pct}%)`;
}
function updateComment(id,val){ const i=appState.itinerary.find(x=>x.id===id); if(i){i.comment=val;markUnsaved();} }
function updateStatus(id,val){
    appState.statuses[id]=val;
    updateStatusDecoration(id,val);
    updateWBSProgress();
    markUnsaved();
    const i=appState.itinerary.find(x=>x.id===id);
    if(i) refreshDayMap(i.day);
}

/* ===== 日程 追加/削除 ===== */
function addTravelDay(){ appState.travelDays++; renderAll(); markUnsaved(); }
function removeTravelDay(d){
    if(appState.travelDays<=1){ showToast('最低1日は必要です。',true); return; }
    showCustomConfirm(`削除すると以降の日程が繰り上がります。\n本当によろしいですか？`,()=>{
        appState.itinerary=appState.itinerary.filter(i=>i.day!==d);
        appState.itinerary.forEach(i=>{if(i.day>d) i.day--;});
        appState.travelDays--;
        renderAll(); markUnsaved();
    });
}

/* ===== モーダル ===== */
function openAddModal(day){
    document.getElementById('add-item-form').reset();
    if(day) document.getElementById('new-day').value=day;
    document.getElementById('add-modal').classList.remove('hidden');
}
function closeAddModal(){ document.getElementById('add-modal').classList.add('hidden'); }
function handleAddItem(e){
    e.preventDefault();
    appState.itinerary.push({ id:Date.now(), day:parseInt(document.getElementById('new-day').value), time:document.getElementById('new-time').value, title:document.getElementById('new-title').value, youtube:document.getElementById('new-youtube').value||null, map:document.getElementById('new-map').value||null, comment:'' });
    sortItinerary(); closeAddModal(); renderTimelineAndWBS(); markUnsaved();
}
function handleDeleteItem(id){
    showCustomConfirm('この予定を削除しますか？',()=>{
        appState.itinerary=appState.itinerary.filter(i=>i.id!==id);
        delete appState.statuses[id];
        renderTimelineAndWBS(); markUnsaved();
    });
}
function openEditModal(id){
    const item=appState.itinerary.find(i=>i.id===id); if(!item) return;
    document.getElementById('edit-id').value=item.id;
    document.getElementById('edit-day').value=item.day;
    document.getElementById('edit-time').value=item.time;
    document.getElementById('edit-title').value=item.title;
    document.getElementById('edit-youtube').value=item.youtube||'';
    document.getElementById('edit-map').value=item.map||'';
    document.getElementById('edit-modal').classList.remove('hidden');
}
function closeEditModal(){ document.getElementById('edit-modal').classList.add('hidden'); }
function submitEdit(e){
    e.preventDefault();
    const id=parseInt(document.getElementById('edit-id').value);
    const item=appState.itinerary.find(i=>i.id===id);
    if(item){
        item.day=parseInt(document.getElementById('edit-day').value);
        item.time=document.getElementById('edit-time').value;
        item.title=document.getElementById('edit-title').value;
        item.youtube=document.getElementById('edit-youtube').value||null;
        item.map=document.getElementById('edit-map').value||null;
        sortItinerary(); renderTimelineAndWBS(); closeEditModal(); markUnsaved();
    }
}

/* ===== 費用 ===== */
function renderAllCosts(){
    const adv=document.getElementById('advance-costs-container'); adv.innerHTML='';
    appState.advanceCosts.forEach(item=>{
        const pp=Math.round((item.total||0)/(item.people||1));
        adv.innerHTML+=`
            <div class="relative bg-white p-3 rounded border border-blue-200 shadow-sm mb-2">
                <button onclick="removeAdvanceCost(${item.id})" class="absolute top-2 right-2 text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-lg"></i></button>
                <input type="text" value="${item.name}" oninput="updateAdvanceCost(${item.id},'name',this.value)" placeholder="項目名" class="w-[85%] border-b border-dashed border-gray-300 mb-3 text-sm font-bold text-gray-700 bg-transparent">
                <div class="flex items-center gap-1 sm:gap-2 text-sm text-gray-600">
                    <input type="number" value="${item.total}" oninput="updateAdvanceCost(${item.id},'total',this.value)" class="w-20 sm:w-24 border border-gray-300 rounded p-1.5 text-right">
                    <span>円 ÷</span>
                    <input type="number" value="${item.people}" oninput="updateAdvanceCost(${item.id},'people',this.value)" min="1" class="w-12 sm:w-16 border border-gray-300 rounded p-1.5 text-right">
                    <span>人 =</span>
                    <span id="adv-pp-${item.id}" class="font-bold text-blue-700 ml-auto bg-blue-50 px-2 py-1 rounded">¥${pp.toLocaleString()}</span>
                </div>
            </div>`;
    });
    const payg=document.getElementById('payg-costs-container'); payg.innerHTML='';
    appState.paygCosts.forEach(item=>{
        payg.innerHTML+=`
            <div class="flex items-center gap-2 bg-white p-3 rounded border border-amber-200 shadow-sm mb-2">
                <input type="text" value="${item.name}" oninput="updatePaygCost(${item.id},'name',this.value)" placeholder="項目名" class="flex-grow border-b border-dashed border-gray-300 text-sm font-bold text-gray-700 bg-transparent">
                <input type="number" value="${item.amount}" oninput="updatePaygCost(${item.id},'amount',this.value)" class="w-24 border border-gray-300 rounded p-1.5 text-right text-sm">
                <span class="text-sm text-gray-600">円</span>
                <button onclick="removePaygCost(${item.id})" class="text-gray-400 hover:text-red-500 ml-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>`;
    });
    updateTotalsOnly();
}
function updateAdvanceCost(id,f,v){
    const i=appState.advanceCosts.find(c=>c.id===id);
    if(f==='total'||f==='people'){i[f]=Number(v)||0;if(i.people<1)i.people=1;const el=document.getElementById(`adv-pp-${id}`);if(el)el.textContent='¥'+Math.round(i.total/i.people).toLocaleString();}
    else i[f]=v;
    updateTotalsOnly(); markUnsaved();
}
function updatePaygCost(id,f,v){
    const i=appState.paygCosts.find(c=>c.id===id);
    if(f==='amount') i[f]=Number(v)||0; else i[f]=v;
    updateTotalsOnly(); markUnsaved();
}
function updateTotalsOnly(){
    let pre=0,post=0;
    appState.advanceCosts.forEach(i=>pre+=Math.round((i.total||0)/(i.people||1)));
    appState.paygCosts.forEach(i=>post+=(i.amount||0));
    document.getElementById('subtotal-pre').textContent=pre.toLocaleString();
    document.getElementById('subtotal-post').textContent=post.toLocaleString();
    document.getElementById('total-cost').textContent=(pre+post).toLocaleString();
}
function addAdvanceCost(){ appState.advanceCosts.push({id:Date.now(),name:'',total:0,people:1}); renderAllCosts(); markUnsaved(); }
function removeAdvanceCost(id){ appState.advanceCosts=appState.advanceCosts.filter(c=>c.id!==id); renderAllCosts(); markUnsaved(); }
function addPaygCost(){ appState.paygCosts.push({id:Date.now(),name:'',amount:0}); renderAllCosts(); markUnsaved(); }
function removePaygCost(id){ appState.paygCosts=appState.paygCosts.filter(c=>c.id!==id); renderAllCosts(); markUnsaved(); }

/* ===== 写真 ===== */
function renderPhotos(){
    appState.itinerary.forEach(item=>{ const g=document.getElementById(`photo-grid-${item.id}`); if(g) g.innerHTML=''; });
    cloudPhotos.forEach(photo=>{
        const g=document.getElementById(`photo-grid-${photo.itemId}`); if(!g) return;
        const w=document.createElement('div');
        w.className='relative aspect-square bg-gray-100 rounded-lg overflow-hidden shadow-sm border border-gray-200 group';
        w.innerHTML=`<a href="${photo.viewUrl}" target="_blank"><img src="${photo.thumbnailUrl}" class="w-full h-full object-cover transition-opacity group-hover:opacity-75"></a>`;
        g.appendChild(w);
    });
}
function triggerUpload(event,itemId){
    const file=event.target.files[0]; if(!file) return;
    const sl=document.getElementById(`upload-status-${itemId}`);
    sl.textContent='送信中...'; sl.className='text-xs text-orange-500 font-bold';
    const reader=new FileReader();
    reader.onload=async function(e){
        const b64=e.target.result.split(',')[1];
        try{
            await gasPost({action:'uploadPhoto',itemId:String(itemId),filename:file.name,contentType:file.type,base64:b64});
            sl.textContent='完了！'; sl.className='text-xs text-emerald-600 font-bold';
            setTimeout(()=>{sl.textContent='';loadFromCloud(false);},1000);
        } catch(err){
            console.error(err); sl.textContent='失敗'; sl.className='text-xs text-red-600 font-bold';
        }
    };
    reader.readAsDataURL(file);
}
</script>
